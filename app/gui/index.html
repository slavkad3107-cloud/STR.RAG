<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>СТРОЙ.RAG</title>
<style>
/* ванильный CSS, полностью оффлайн — без CDN и фреймворков (как в ЭКО.DOC) */
:root{--b:#1f4e79;--bg:#f4f6f9;--card:#fff;--line:#d9dee7;--warn:#b03000;
      --ok:#1d7a3d;--mut:#667}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",Arial,sans-serif;background:var(--bg);color:#222}
header{background:var(--b);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;
       gap:10px;align-items:center}
header b{font-size:17px;margin-right:8px}
header select,header input,header button{font:inherit;padding:4px 8px;border:0;border-radius:4px}
header .mut{color:#cfe0f2;font-size:13px;width:100%}
nav{display:flex;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:1;padding:11px 4px;border:0;background:none;font:inherit;font-weight:600;
           cursor:pointer;color:#456;border-bottom:3px solid transparent}
nav button.on{color:var(--b);border-bottom-color:var(--b);background:#eef3fa}
main{padding:14px;max-width:1280px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;
      padding:12px 14px;margin-bottom:12px}
h3{margin:2px 0 10px;font-size:16px;color:var(--b)}
button.act{background:var(--b);color:#fff;border:0;border-radius:5px;padding:7px 14px;
           font:inherit;cursor:pointer;margin:2px 4px 2px 0}
button.act:disabled{background:#9ab}
button.sec{background:#e7ecf3;color:#234;border:1px solid var(--line);border-radius:5px;
           padding:6px 12px;font:inherit;cursor:pointer;margin:2px 4px 2px 0}
input[type=text],textarea,select.inp{font:inherit;padding:6px 8px;border:1px solid var(--line);
           border-radius:5px;width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:#fff}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{background:#eef2f7;position:sticky;top:46px}
tr:hover td{background:#f7fafd}
.bar{height:16px;background:#e7ecf3;border-radius:8px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .5s}
.msg{font-size:13.5px;color:var(--mut);white-space:pre-wrap}
.warn{color:var(--warn);font-weight:600}
.ok{color:var(--ok)}
.badge{display:inline-block;font-size:12px;border-radius:9px;padding:1px 8px;background:#e7ecf3}
.badge.w{background:#fde3d6;color:var(--warn)}
.badge.g{background:#dcf2e3;color:var(--ok)}
.split{display:flex;gap:12px;align-items:flex-start}
.split>.l{flex:1;min-width:340px}.split>.r{flex:1.4}
#ansDetail{white-space:pre-wrap;background:#fff;border:1px solid var(--line);
           border-radius:8px;padding:12px;font-size:14px;max-height:70vh;overflow:auto}
#toast{position:fixed;right:16px;bottom:16px;background:#223;color:#fff;padding:10px 16px;
       border-radius:8px;opacity:0;transition:opacity .3s;max-width:460px;z-index:99}
tr.sel td{background:#e2ecfa!important}
.drop{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;
      color:var(--mut);margin:8px 0}
.drop.hov{border-color:var(--b);color:var(--b);background:#eef3fa}
img.scan{max-width:100%;border:1px solid var(--line);border-radius:6px;margin-top:8px}
</style>
</head>
<body>
<header>
  <b>СТРОЙ.RAG</b>
  <label>Объект: <select id="prj" onchange="switchProject()"></select></label>
  <button class="sec" onclick="newProject()">+ Новый</button>
  <button class="sec" onclick="exportProject()" title="Сохранить объект в zip (перенос на другой компьютер)">📦 Экспорт</button>
  <button class="sec" onclick="$('impInp').click()" title="Загрузить объект из zip экспорта">📥 Загрузить</button>
  <input type="file" id="impInp" hidden accept=".zip" onchange="importProject(this.files[0])">
  <button class="sec" onclick="delProject()" title="Удалить объект (папка уходит в _trash)">✖ Удалить</button>
  <label>Раздел: <select id="tgt" onchange="setTarget()"></select></label>
  <span class="mut" id="hdrInfo">—</span>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="toast"></div>

<script>
"use strict";
/* ── каркас: состояние, api, вкладки ── */
let P = "";                       // текущий проект
let META = {};
let remarksPath = "";             // выбранный файл замечаний
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(name, body, q) {
  const qs = new URLSearchParams(Object.assign({}, q, name.match(/^(info|index_state|registry|answers|answers_state|uprza|corr_list|versions|gen_state)$/) ? {project: P} : {})).toString();
  const r = await fetch(`/api/${name}${qs ? "?" + qs : ""}`,
    body === undefined ? {} : {method: "POST", body: JSON.stringify(body)});
  const d = await r.json();
  if (d && d.error) throw new Error(d.error);
  return d;
}
async function apiRaw(name, q, blob) {   // загрузка файлов сырым телом
  if (!P) throw new Error("сначала создайте объект («+ Новый»)");
  const qs = new URLSearchParams(Object.assign({project: P}, q)).toString();
  const r = await fetch(`/api/${name}?${qs}`, {method: "POST", body: blob});
  const d = await r.json();
  if (d && d.error) throw new Error(d.error);
  return d;
}
function toast(t, isErr) {
  const el = $("toast");
  el.textContent = t;
  el.style.background = isErr ? "#8c2f00" : "#223";
  el.style.opacity = 1;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.opacity = 0, isErr ? 7000 : 3500);
}
const err = e => toast("Ошибка: " + e.message, true);

const TABS = ["ЗАГРУЗКА","БАЗА","ДАННЫЕ","ОТВЕТЫ","ВЫГРУЗКА","УПРЗА","СЕРВИС"];
function buildTabs() {
  $("nav").innerHTML = TABS.map((t,i) =>
    `<button id="nb${i}" onclick="showTab(${i})">${t}</button>`).join("");
  $("main").innerHTML = TABS.map((t,i) => `<section id="tab${i}"></section>`).join("");
}
function showTab(i) {
  TABS.forEach((_,k) => {
    $("nb"+k).classList.toggle("on", k===i);
    $("tab"+k).classList.toggle("on", k===i);
  });
  [renderUpload,renderIndex,renderData,renderAnswers,renderExport,renderUprza,renderService][i]();
}

/* ── шапка ── */
async function boot() {
  META = await api("meta");
  $("prj").innerHTML = META.projects.map(p => `<option>${esc(p)}</option>`).join("");
  P = localStorage.getItem("strrag_prj") || META.projects[0] || "";
  if (META.projects.includes(P)) $("prj").value = P; else P = META.projects[0] || "";
  $("tgt").innerHTML = META.targets.map(t =>
    `<option value="${t.code}"${t.code===META.target?" selected":""}>${esc(t.label)}</option>`).join("");
  buildTabs();
  await refreshHeader();
  showTab(0);
  setInterval(pollStates, 2500);
  setInterval(pollGen, 3000);
}
async function refreshHeader() {
  if (!P) { $("hdrInfo").textContent = "создайте объект («+ Новый»)"; return; }
  try {
    const i = await api("info");
    $("hdrInfo").innerHTML =
      `<a href="#" onclick="editOrg();return false" title="изменить организацию">🏢 ${esc(i.organization || "организация не указана")}</a> · ` +
      `<a href="#" onclick="showTab(1);return false" title="тип меняется во вкладке БАЗА">📐 тип: <b>${esc(i.object_type)}</b></a> · ` +
      `🤖 единая модель: ${esc(i.model || META.model)} · ${esc(META.version)}`;
    window._info = i;
  } catch (e) { err(e); }
}
async function switchProject() {
  const next = $("prj").value;
  if (next === P) return;
  if (!confirm(`Перейти к объекту «${next}»?\nДанные во всех вкладках сменятся.`)) {
    $("prj").value = P; return;
  }
  P = next; localStorage.setItem("strrag_prj", P);
  remarksPath = "";
  await refreshHeader();
  showTab(0);
}
async function newProject() {
  const name = prompt("Название объекта/проекта:");
  if (!name) return;
  try {
    await api("project_new", {name});
    META = await api("meta");
    $("prj").innerHTML = META.projects.map(p => `<option>${esc(p)}</option>`).join("");
    $("prj").value = name.trim(); P = name.trim();
    localStorage.setItem("strrag_prj", P);
    await refreshHeader(); showTab(0);
  } catch (e) { err(e); }
}
async function setTarget() {
  try { await api("target", {code: $("tgt").value}); toast("Раздел переключён."); }
  catch (e) { err(e); }
}
async function editOrg() {
  if (!P) return;
  const v = prompt("Организация (заказчик / проектировщик):", (window._info||{}).organization || "");
  if (v === null) return;
  try { await api("org", {project: P, organization: v.trim()}); toast("Организация сохранена."); await refreshHeader(); }
  catch (e) { err(e); }
}
async function setObjectType(v) {
  try {
    const r = await api("object_type", {project: P, value: v});
    toast(`Тип объекта «${r.object_type}» — применится ${r.applied}.`);
    await refreshHeader();
  } catch (e) { err(e); }
}
async function reloadProjects(selectName) {
  META = await api("meta");
  $("prj").innerHTML = META.projects.map(p => `<option>${esc(p)}</option>`).join("");
  P = META.projects.includes(selectName) ? selectName : (META.projects[0] || "");
  $("prj").value = P; localStorage.setItem("strrag_prj", P);
  remarksPath = "";
  await refreshHeader(); showTab(0);
}
async function delProject() {
  if (!P) return toast("Объект не выбран.", true);
  if (!confirm(`Удалить объект «${P}»?\nПапка объекта уйдёт в _trash (можно вернуть вручную), база поиска будет удалена.`)) return;
  const victim = P;
  // опрос вкладок (каждые 2,5 с) пересоздавал папку удаляемого объекта —
  // на время удаления текущий объект снимаем
  P = ""; localStorage.removeItem("strrag_prj");
  try {
    const r = await api("project_delete", {name: victim, confirm: victim});
    toast("Объект удалён" + (r.trashed ? " (копия в _trash)" : ""));
  } catch (e) { err(e); }
  await reloadProjects("");
}
async function exportProject() {
  if (!P) return toast("Объект не выбран.", true);
  try {
    const r = await api("project_export", {name: P});
    toast("Экспорт готов: " + r.name);
    openPath(r.path);
  } catch (e) { err(e); }
}
async function importProject(f) {
  if (!f) return;
  try {
    const qs = new URLSearchParams({name: encodeURIComponent(f.name)}).toString();
    const resp = await fetch(`/api/project_import?${qs}`, {method: "POST", body: f});
    const d = await resp.json();
    if (d && d.error) throw new Error(d.error);
    toast("Объект загружен: " + d.project);
    await reloadProjects(d.project);
  } catch (e) { err(e); }
  $("impInp").value = "";
}

/* ── ЗАГРУЗКА ── */
function renderUpload() {
  const i = window._info || {uploads: [], remarks: []};
  $("tab0").innerHTML = `
  <div class="card"><h3>Файлы проектной документации</h3>
    <div class="drop" id="drop">Перетащите файлы сюда (pdf / docx / xlsx / jpg / png /
      tif / xml / zip — папку можно архивом) или
      <button class="sec" onclick="$('fileInp').click()">выбрать…</button>
      <input type="file" id="fileInp" multiple hidden onchange="upFiles(this.files)">
    </div>
    <div style="margin:6px 0">
      <input type="text" id="urlInp" placeholder="…или ссылка https / Google Drive" style="width:60%">
      <button class="act" onclick="upUrl()">⬇ Скачать</button>
      <input type="text" id="dirInp" placeholder="…или путь к папке на диске" style="width:40%;margin-top:6px">
      <button class="act" onclick="upDir()">📂 Показать папку и выбрать файлы</button>
      <div id="dirBox"></div>
    </div>
    <table><thead><tr><th>Файл</th><th style="width:90px">Размер</th></tr></thead>
    <tbody>${i.uploads.map(f =>
      `<tr><td>${esc(f.name)}</td><td>${f.kb} КБ</td></tr>`).join("") ||
      "<tr><td colspan=2>файлов пока нет</td></tr>"}</tbody></table>
  </div>
  <div class="card"><h3>Организация (видна в шапке)</h3>
    <input type="text" id="orgInp" value="${esc((window._info||{}).organization||"")}"
           placeholder="ООО «…» — заказчик / проектировщик" style="width:70%">
    <button class="act" onclick="saveOrg()">💾 Сохранить</button>
  </div>
  <div class="card"><h3>🗂 Версии документов (какую редакцию использовать)</h3>
    <div class="msg">Если один и тот же том загружен в нескольких редакциях (старая и
      откорректированная), здесь видно все версии; отметьте актуальную — поиск, ответы и
      генерация используют только её. Список появляется после индексации.</div>
    <div id="verBox" class="msg">…</div>
  </div>`;
  const dz = $("drop");
  dz.ondragover = e => { e.preventDefault(); dz.classList.add("hov"); };
  dz.ondragleave = () => dz.classList.remove("hov");
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove("hov"); upFiles(e.dataTransfer.files); };
  loadVersions();
}
async function loadVersions() {
  const box = $("verBox");
  if (!box) return;
  if (!P) { box.textContent = "объект не выбран"; return; }
  let d;
  try { d = await api("versions"); } catch (e) { box.textContent = "версии: " + e.message; return; }
  const multi = (d.groups || []).filter(g => g.multi);
  const single = (d.groups || []).length - multi.length;
  if (!multi.length) {
    box.textContent = (d.groups || []).length
      ? `Документов с несколькими редакциями нет (томов: ${single}).`
      : "Документы ещё не проиндексированы — версии определяются при индексации (вкладка БАЗА).";
    return;
  }
  box.innerHTML = multi.map(g => `
    <div style="margin:6px 0;padding:6px;border:1px solid var(--line);border-radius:6px">
      <b>${esc(g.section || "?")}</b> · ${esc(g.base || g.key)} — редакций: ${g.versions.length}<br>
      ${g.versions.map(v => `
        <label style="display:block;margin:2px 0">
          <input type="radio" name="ver_${esc(g.key)}" data-vgroup="${esc(g.key)}" data-vfile="${esc(v.file)}"
                 ${v.is_current ? "checked" : ""}>
          ${v.is_current ? "<b>" : ""}${esc(v.file)}${v.is_current ? " ← используется</b>" : ""}
          <span class="mut">${esc(v.label || "")}${v.date ? " · " + esc(v.date) : ""}</span>
        </label>`).join("")}
    </div>`).join("") +
    ((d.warnings || []).length ? `<div class="warn">⚠ ${d.warnings.map(esc).join("<br>")}</div>` : "") +
    `<div class="mut">Неактуальные версии исключены из поиска: ${(d.inactive || []).length}. ` +
    `Ответы, сформированные раньше, пересоберите (вкладка ОТВЕТЫ).</div>`;
  box.querySelectorAll("[data-vgroup]").forEach(r => r.onchange = async () => {
    try {
      await api("version_set", {project: P, group: r.dataset.vgroup, file: r.dataset.vfile});
      toast("Актуальная редакция: " + r.dataset.vfile);
      loadVersions();
    } catch (e) { err(e); }
  });
}
async function upFiles(files) {
  let n = 0;
  for (const f of files) {
    try {
      const r = await apiRaw("upload", {name: encodeURIComponent(f.name)}, f);
      n += r.saved.length;
    } catch (e) { err(e); }
  }
  toast(`Добавлено файлов: ${n}. Дальше — вкладка БАЗА.`);
  await refreshHeader(); renderUpload();
}
async function upUrl() {
  try {
    const r = await api("fetch_url", {project: P, url: $("urlInp").value});
    toast("Скачано: " + r.saved.join(", "));
    await refreshHeader(); renderUpload();
  } catch (e) { err(e); }
}
async function upDir() {
  // сначала ПОКАЗЫВАЕМ содержимое папки и даём выбрать (07.09: «попадают
  // не выбранные файлы») — копируются только отмеченные
  const path = $("dirInp").value.trim();
  if (!path) return toast("Укажите путь к папке.", true);
  try {
    const r = await api("copy_folder", {project: P, path, list: true});
    const box = $("dirBox");
    if (!r.files.length) { box.innerHTML = "<span class='msg'>папка пуста</span>"; return; }
    window._dirFiles = r.files;
    box.innerHTML = `<div class="msg">В папке файлов: ${r.files.length}, поддерживаемых: ${r.supported}.
        Отметьте, что забрать (файлы подпапок помечены 📁):</div>
      <div style="margin:4px 0">
        <button class="sec" onclick="dirMark('all')">выбрать все</button>
        <button class="sec" onclick="dirMark('top')">только корень папки</button>
        <button class="sec" onclick="dirMark('none')">снять все</button>
      </div>
      <div style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px">
      ${r.files.map((f,i) => `<label style="display:block;${f.ok ? "" : "color:var(--mut)"}">
        <input type="checkbox" data-dfi="${i}" ${f.ok && !f.sub ? "checked" : ""} ${f.ok ? "" : "disabled"}>
        ${f.sub ? "📁 " : ""}${esc(f.rel)} <span class="mut">${f.kb} КБ${f.ok ? "" : " · формат не поддерживается"}</span></label>`).join("")}
      </div>
      <button class="act" onclick="upDirCopy()">📂 Забрать отмеченные</button>
      <button class="sec" onclick="$('dirBox').innerHTML=''">Отмена</button>`;
  } catch (e) { err(e); }
}
function dirMark(mode) {
  document.querySelectorAll("[data-dfi]").forEach(cb => {
    const f = window._dirFiles[+cb.dataset.dfi];
    if (cb.disabled) return;
    cb.checked = mode === "all" ? true : mode === "top" ? !f.sub : false;
  });
}
async function upDirCopy() {
  const files = [...document.querySelectorAll("[data-dfi]")].filter(cb => cb.checked)
    .map(cb => window._dirFiles[+cb.dataset.dfi].rel);
  if (!files.length) return toast("Ничего не отмечено.", true);
  try {
    const r = await api("copy_folder", {project: P, path: $("dirInp").value.trim(), files});
    toast(`Скопировано файлов: ${r.copied}`);
    await refreshHeader(); renderUpload();
  } catch (e) { err(e); }
}
async function saveOrg() {
  try {
    await api("org", {project: P, organization: $("orgInp").value});
    toast("Сохранено."); await refreshHeader();
  } catch (e) { err(e); }
}

/* ── БАЗА (индексация) ── */
function renderIndex() {
  const ot = (window._info||{}).object_type || "площадной";
  $("tab1").innerHTML = `
  <div class="card"><h3>RAG-база: индексация документов</h3>
    <div style="margin-bottom:6px">
      <label>Тип объекта: <select id="otSel" onchange="setObjectType(this.value)">
        <option ${ot==="площадной"?"selected":""}>площадной</option>
        <option ${ot==="линейный"?"selected":""}>линейный</option></select></label>
      <span class="msg">влияет на распознавание разделов (ППО/ТКР у линейных);
        для уже собранной базы новый тип применится при «♻ Переиндексировать заново»</span>
    </div>
    <button class="act" onclick="idx('start')">▶ Индексировать</button>
    <button class="sec" onclick="idxReindex()">♻ Переиндексировать заново</button>
    <button class="sec" onclick="idx('pause')">⏸ Пауза</button>
    <button class="sec" onclick="idx('stop')">⏹ Стоп</button>
    <div class="bar"><i id="idxBar"></i></div>
    <div class="msg" id="idxMsg">—</div>
  </div>
  <div class="card"><h3>Найденные данные (после индексации — подробно в ДАННЫХ)</h3>
    <div id="foundBox">—</div>
  </div>`;
  pollStates();
}
async function idx(action) {
  const body = {project: P, action};
  if ($("otSel") && (action === "start" || action === "reindex")) body.object_type = $("otSel").value;
  try { await api("index", body); toast("Команда отправлена."); }
  catch (e) { err(e); }
}
function idxReindex() {
  if (confirm("Стереть базу проекта и переиндексировать заново?\n" +
      "Нужно после обновлений с починкой распознавания (битые тома ООС)."))
    idx("reindex");
}

/* ── ДАННЫЕ ── */
async function renderData() {
  let d;
  try { d = await api("registry"); } catch (e) { err(e); return; }
  const conf = d.rows.filter(r => r.conflict).length;
  $("tab2").innerHTML = `
  <div class="card"><h3>Показатели проекта (из документов, с источником)</h3>

    toast(action === "start" ? (r.pid ? "Поиск ответов запущен." : "Уже идёт.")

async function decideSel(status) {

  const a = window._ans[window._ansSel];
  try {
    await api("decide", {project: P, numbers: [a.number], status});

async function decideAll(status) {
  const nums = (window._ans||[]).filter(a => (a.answer||"").trim() && a.status === "proposed" && !a.needs_ai)
                                .map(a => a.number);
  if (!nums.length) return toast("Непустых непринятых ответов нет.");
  if (!confirm(`Принять ${nums.length} ответов?`)) return;
  try { await api("decide", {project: P, numbers: nums, status}); renderAnswers(); }
  catch (e) { err(e); }
}

async function corrUpload(files) {
  let n = 0; const notes = [];
  for (const f of files) {
    const conv = !/\.docx$/i.test(f.name);
    if (conv) $("corrBox").textContent = `Конвертирую ${f.name} в .docx (PDF/DOC → секунды; скан с OCR — минуты)…`;
    try {
      const r = await apiRaw("corr_upload", {name: encodeURIComponent(f.name)}, f);
      n++;
      if (r.note) notes.push(`${r.saved}: ${r.note}`);
    } catch (e) { err(e); }
  }
  $("corrBox").textContent = notes.join("\n");
  toast(`Загружено томов: ${n}`); renderExport();
}

    let t = "✅ Готово: " + r.names.join(", ");
    if ((r.failed || []).length) t += "\n⚠ НЕ обработаны: " + r.failed.join("; ");
    $("corrBox").textContent = t;
    renderCorrReport(r.report || {});
    if (r.outputs[0]) {
      const b = document.createElement("button");
      b.className = "sec"; b.textContent = "Открыть папку результатов";
      b.onclick = () => openPath(r.outputs[0]);
      $("corrBox").appendChild(document.createElement("br"));
      $("corrBox").appendChild(b);
    }
  } catch (e) { $("corrBox").textContent = ""; err(e); }
}
async function doExport(kind) {
  $("expMsg").textContent = "Формирование…";
  try {
    const r = await api("export", {project: P, kind});
    const p1 = r.path || Object.values(r.paths || {})[0] || "";
    $("expMsg").innerHTML = `<span class="ok">Готово:</span> ${esc(r.path || JSON.stringify(r.paths))}
      <button class="sec" id="expOpen">Открыть</button>`;
    $("expOpen").onclick = () => openPath(p1);
  } catch (e) { $("expMsg").textContent = ""; err(e); }
}
async function openPath(p) {
  try { await api("open", {path: p}); } catch (e) { err(e); }
}
async function genStart() {
  if (!P) return toast("Объект не выбран.", true);
  try {
    const r = await api("gen", {project: P, action: "start", target: $("tgt").value});
    toast(`Генерация раздела ${r.target} запущена (минуты — по главе за запрос к ИИ).`);
    pollGen();
  } catch (e) { err(e); }
}
async function genStop() {
  try { await api("gen", {project: P, action: "stop"}); toast("Остановка после текущей главы…"); }
  catch (e) { err(e); }
}
async function pollGen() {
  const box = $("genBox");
  if (!box || !P) return;
  let s;
  try { s = await api("gen_state"); } catch (e) { return; }
  const running = s.status === "running";
  if ($("genStart")) $("genStart").disabled = running;
  if ($("genStop")) $("genStop").disabled = !running;
  if (!s.status || s.status === "idle") { box.textContent = ""; return; }
  const prog = s.total ? ` ${s.done || 0}/${s.total} глав` : "";
  const ru = {running: "⏳ идёт", done: "✅ готово", stopped: "⏹ остановлено", error: "⚠ ошибка"}[s.status] || s.status;
  box.innerHTML = `${ru}${prog}: ${esc(s.message || "")}` +
    (s.output && s.status === "done"
      ? ` <button class="sec" id="genOpen">Открыть документ</button>` : "");
  if ($("genOpen")) $("genOpen").onclick = () => openPath(s.output);
}

/* ── УПРЗА ── */
async function renderUprza() {
  let d;
  try { d = await api("uprza"); } catch (e) { d = {rows: []}; }
  const exc = (d.exceedances || []).length;
  $("tab5").innerHTML = `
  <div class="card"><h3>УПРЗА «Эколог» / ИНТЕГРАЛ</h3>
    <button class="act" onclick="doExport2()">📤 Сформировать выгрузку для УПРЗА</button>
    <button class="sec" onclick="$('uprInp').click()">📥 Импортировать результаты…</button>
    <input type="file" id="uprInp" hidden accept=".txt,.csv,.xlsx" onchange="upUprza(this.files[0])">
    <div class="msg" id="uprMsg">${d.file ? `загружено: ${esc(d.file)} · ${esc(d.imported_at||"")}` : ""}</div>
    ${exc ? `<div class="warn">⚠ ПРЕВЫШЕНИЯ (&gt;1 ПДК): ${d.exceedances.map(r =>
        `${esc(r.code)} ${esc(r.name||"")} — ${r.max_pdk.toFixed(2)}`).join(", ")}</div>` : ""}
    <table><thead><tr><th>Код ЗВ</th><th>Вещество</th><th>Макс, доли ПДК</th></tr></thead>
    <tbody>${(d.rows||[]).slice(0,60).map(r =>
      `<tr><td>${esc(r.code)}</td><td>${esc(r.name)||"—"}</td><td>${r.max_pdk}</td></tr>`).join("") ||
      "<tr><td colspan=3>результаты не импортированы</td></tr>"}</tbody></table>
  </div>`;
}
async function doExport2() {
  try {
    const r = await api("export", {project: P, kind: "uprza_out"});
    toast("Выгрузка для УПРЗА готова.");
    openPath(Object.values(r.paths)[0]);
  } catch (e) { err(e); }
}
async function upUprza(f) {
  if (!f) return;
  try {
    const r = await apiRaw("uprza_import", {name: encodeURIComponent(f.name)}, f);
    toast(`Импортировано веществ: ${r.rows}` +
      (r.exceedances.length ? ` · превышений: ${r.exceedances.length}` : ""));
    renderUprza();
  } catch (e) { err(e); }
}

/* ── СЕРВИС (как в ЭКО.DOC): модели ИИ ── */
async function renderService() {
  let d;
  try { d = await api("ai_options"); } catch (e) { err(e); return; }
  window._ai = d;
  const probing = d.probe && d.probe.running;
  const rows = d.providers.map(p => {
    const st = !p.has_key ? "<span class='mut'>нет ключа</span>"
             : p.ok ? "<span class='ok'>✅ работает</span>"
             : p.error ? `<span class='warn'>⚠ ${esc(p.error)}</span>`
             : "<span class='mut'>не проверялся</span>";
    const rank = d.ranked.indexOf(p.name);
    return `<tr class="${p.name === d.current ? "sel" : ""}">
      <td>${rank >= 0 ? rank + 1 : "—"}</td>
      <td><b>${esc(p.name)}</b>${p.name === d.current ? " ← текущий" : ""}</td>
      <td>${esc(p.tier)}</td><td>${st}</td>
      <td>${esc(p.best_model || p.current_model || "")}</td>
      <td>${p.ms != null ? p.ms + " мс" : ""}</td></tr>`;
  }).join("");
  $("tab6").innerHTML = `
  <div class="card"><h3>🤖 Модели ИИ — состояние и выбор лучшей</h3>
    <div class="msg">Одна модель используется во всех местах программы (ответы, показатели,
      генерация). Ранжирование по ТЗ: большие бесплатные → локальные → DeepSeek.
      Ключи берутся из общих настроек (.env / config).
      ${d.checked_at ? "Последняя проверка: " + esc(d.checked_at) : "Проверка ещё не выполнялась."}</div>
    <label style="display:block;margin:6px 0"><input type="checkbox" id="aiAutoPick" ${d.auto_pick ? "checked" : ""}
      onchange="aiAutoPickToggle(this.checked)"> <b>При каждом запуске проверять все модели и применять лучшую</b>
      (как в ЭКО.DOC); снятая галочка закрепляет выбранную вручную модель</label>
    <div class="msg">${d.startup && d.startup.done_at
      ? `Проверка при запуске (${esc(d.startup.done_at.replace("T"," "))}): ${esc(d.startup.chosen || "—")} — ${esc(d.startup.note || "")}`
      : (d.startup && d.startup.running ? "⏳ идёт проверка при запуске…" : "")}</div>
    <button class="act" onclick="aiProbe()" ${probing ? "disabled" : ""}>🔍 Проверить все модели</button>
    <button class="act" onclick="aiAuto()">⭐ Выбрать лучшую автоматически</button>
    <span class="msg" id="aiMsg">${probing ? "⏳ идёт проверка провайдеров…" : (d.probe && d.probe.error ? "⚠ " + esc(d.probe.error) : "")}</span>
    <table><thead><tr><th>#</th><th>Провайдер</th><th>Уровень</th><th>Состояние</th><th>Лучшая модель</th><th>Отклик</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>
  <div class="card"><h3>✋ Выбор ИИ вручную (провайдер и модель)</h3>
    <div class="msg">Текущий: <b>${esc(d.current)}</b> · ${esc(d.current_model || "—")}</div>
    <label>Провайдер: <select id="aiProv" onchange="aiFillModels()">${d.providers.map(p =>
      `<option value="${esc(p.name)}" ${p.name === d.current ? "selected" : ""}>${esc(p.name)}${p.has_key ? "" : " (нет ключа)"}</option>`).join("")}</select></label>
    <label>Модель: <select id="aiModel"></select></label>
    <input type="text" id="aiModelTxt" placeholder="…или имя модели вручную" style="width:36%">
    <label><input type="checkbox" id="aiSingle" ${d.single_model ? "checked" : ""}> одна модель во всех местах</label>
    <label><input type="checkbox" id="aiPin" ${d.auto_pick ? "" : "checked"}> закрепить этот выбор (не менять при запуске)</label>
    <button class="act" onclick="aiSet()">💾 Применить</button>
  </div>`;
  aiFillModels();
  if (probing) setTimeout(() => { if ($("tab6").classList.contains("on")) renderService(); }, 4000);
}
function aiFillModels() {
  const d = window._ai || {providers: []};
  const p = d.providers.find(x => x.name === $("aiProv").value) || {models: []};
  const list = (p.models || []).slice();
  if (p.current_model && !list.includes(p.current_model)) list.unshift(p.current_model);
  $("aiModel").innerHTML = list.map(m =>
    `<option ${m === p.current_model ? "selected" : ""}>${esc(m)}</option>`).join("") ||
    "<option value=''>— список появится после проверки —</option>";
}
async function aiAutoPickToggle(on) {
  try {
    await api("ai_select", {mode: "auto_pick", auto_pick: on});
    toast(on ? "При запуске будет выбираться лучшая модель." : "Выбор модели закреплён — при запуске не меняется.");
  } catch (e) { err(e); }
}
async function aiProbe() {
  try { await api("ai_probe", {}); toast("Проверка запущена (до минуты)…"); renderService(); }
  catch (e) { err(e); }
}
async function aiAuto() {
  try {
    const r = await api("ai_select", {mode: "auto"});
    toast(`Выбрано: ${r.provider} · ${r.model}`);
    META = await api("meta"); await refreshHeader(); renderService();
  } catch (e) { err(e); }
}
async function aiSet() {
  const model = ($("aiModelTxt").value || "").trim() || $("aiModel").value;
  try {
    const r = await api("ai_select", {mode: "manual", provider: $("aiProv").value, model,
                                      single_model: $("aiSingle").checked,
                                      auto_pick: !$("aiPin").checked});
    toast(`Применено: ${r.provider} · ${r.model}`);
    META = await api("meta"); await refreshHeader(); renderService();
  } catch (e) { err(e); }
}

/* ── опрос фоновых процессов ── */
async function pollStartup() {
  // проверка моделей при запуске (как в ЭКО.DOC): пока идёт — подсказка в шапке,
  // по завершении — обновить шапку и сообщить, что выбрано
  if (window._startupDone) return;
  try {
    const s = await api("ai_state");
    if (s.running) {
      if (!$("hdrStartup")) $("hdrInfo").insertAdjacentHTML("beforeend",
        ' <span id="hdrStartup">· ⏳ проверка моделей при запуске…</span>');
      return;
    }
    if (s.done_at) {
      window._startupDone = true;
      await refreshHeader();
      toast(`Модели проверены: ${s.chosen || "—"}. ${s.note || ""}`, !s.chosen);
      if ($("tab6") && $("tab6").classList.contains("on")) renderService();
    }
  } catch (e) {}
}
async function pollStates() {
  pollStartup();
  if (!P) return;
  try {
    const s = await api("index_state");
    if ($("idxBar")) {
      const t = s.total_files || 0, dn = s.done_files || 0;
      $("idxBar").style.width = (t ? Math.round(dn/t*100) : 0) + "%";
      $("idxMsg").textContent = `[${s.status||"—"}] файлов ${dn}/${t}` +
        (s.current_file ? ` · сейчас: ${s.current_file}` : "") +
        (s.message ? `\n${s.message}` : "");
    }
    const a = await api("answers_state");
    if ($("ansBar")) {
      const t = a.total || 0, dn = a.done || 0;
      $("ansBar").style.width = (t ? Math.round(dn/t*100) : 0) + "%";
      const m = `[${a.status||"—"}] ${dn}/${t}` + (a.message ? ` · ${a.message}` : "");
      $("ansMsg").textContent = m;
      // перерисовать список ОДИН раз на переходе running→done (иначе цикл)
      if (a.status === "done" && window._ansWasRunning &&
          $("tab3").classList.contains("on")) { window._ansWasRunning = false; renderAnswers(); }
      if (a.status === "running") window._ansWasRunning = true;
    }
    if ($("foundBox")) {
      const d = await api("registry");
      const found = d.rows.filter(r => String(r.value||"").trim());
      $("foundBox").innerHTML = found.length ?
        `<table><thead><tr><th>Показатель</th><th>Значение</th><th>Источник</th><th></th></tr></thead><tbody>` +
        found.map(r => `<tr><td>${esc(r.label)}</td><td><b>${esc(r.value)} ${esc(r.unit)}</b></td>
          <td class="msg">${esc(r.source)}</td>
          <td>${r.conflict ? '<span class="badge w">⚠ расхождение</span>' : ""}</td></tr>`).join("") +
        "</tbody></table>" : "— (запустите индексацию или «Собрать показатели» в ДАННЫХ)";
    }
    if ($("collMsg") && window._reg && window._reg.job && window._reg.job.running) {
      const d = await api("registry");
      if (!d.job.running) {
        toast(d.job.error ? "Сбор не удался: " + d.job.error : "Показатели собраны.", !!d.job.error);
        renderData();
      }
    }
  } catch (e) { /* тихо: сервер мог быть занят */ }
}

boot();
</script>
